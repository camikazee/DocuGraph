# Portainer source-build stack.
#
# Add a Repository stack, select this file, enable build from repository, paste
# .env.portainer.example values, and expose only the frontend through your
# reverse proxy. The backend and MongoDB stay on the stack network.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      MONGO_URI: mongodb://mongo:27017/docugraph
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Portainer}
      MEDIA_SECRET: ${MEDIA_SECRET:?Set MEDIA_SECRET in Portainer}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      APP_URL: ${APP_URL:?Set APP_URL in Portainer}
      CORS_ORIGINS: ${APP_URL:?Set APP_URL in Portainer}
      WORKSPACE_ROOT: /data/workspaces
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-DocuGraph <no-reply@docugraph.local>}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_CALLBACK_URL: ${SLACK_CALLBACK_URL:-}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      AUTH_THROTTLE_TTL_MS: ${AUTH_THROTTLE_TTL_MS:-60000}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
    volumes:
      - workspace-data:/data/workspaces
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      DOCUGRAPH_API_UPSTREAM: http://backend:3000/api/v1
    ports:
      - '${DOCUGRAPH_PORT:-3002}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  workspace-data:
