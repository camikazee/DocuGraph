name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    name: Installation (compose · installer · doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate portable installation
        run: |
          bash scripts/compose-contract.test.sh
          bash scripts/install.test.sh
          bash scripts/doctor.test.sh

  backend:
    name: Backend (lint · unit · e2e · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: ../scripts/validate-project-docs.sh

      # Cache the mongod binary that mongodb-memory-server downloads for e2e.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend (lint · typecheck · unit · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: ../scripts/validate-project-docs.sh

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
